<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12100d" />
  <title>Round Rock · 1878</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12100d;
      --panel: #1b1813;
      --text: #f1e7d3;
      --muted: #a99d89;
      --line: rgba(241,231,211,.14);
      --accent: #d6a55d;
      --danger: #e09a8c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      min-height: 100dvh;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
    }
    main { width: min(100%, 520px); text-align: center; }
    .eyebrow {
      font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 18px;
    }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: clamp(42px, 12vw, 72px); line-height: .98; margin: 0 0 18px; }
    #sub { color: var(--muted); font-size: 17px; line-height: 1.5; min-height: 52px; margin: 0 auto 30px; max-width: 430px; }
    #enter {
      width: 100%; min-height: 64px; border: 1px solid rgba(214,165,93,.55); border-radius: 18px;
      background: var(--accent); color: #18120b; font-weight: 760; font-size: 18px; cursor: pointer;
      box-shadow: 0 16px 42px rgba(0,0,0,.25); transition: transform .12s ease, opacity .12s ease;
    }
    #enter:active { transform: scale(.985); }
    #enter:disabled { opacity: .56; cursor: wait; }
    #enter.live { background: transparent; color: var(--text); border-color: var(--line); }
    .presence { display: flex; align-items: center; justify-content: center; gap: 9px; margin: 22px 0 4px; font-size: 13px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #746b5e; }
    .dot.live { background: #88b98a; box-shadow: 0 0 0 6px rgba(136,185,138,.08); }
    .dot.error { background: var(--danger); }
    details { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 16px; text-align: left; color: var(--muted); font-size: 12px; }
    summary { cursor: pointer; text-align: center; user-select: none; }
    #trace { margin-top: 12px; max-height: 210px; overflow: auto; white-space: pre-wrap; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
    audio { width: 1px; height: 1px; opacity: 0; position: fixed; pointer-events: none; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Round Rock · 1878</div>
    <h1 id="title">The New Hand</h1>
    <p id="sub">One tap. Then talk naturally. Interrupt. Look around. Take your time.</p>
    <button id="enter">Enter Round Rock</button>
    <div class="presence"><span id="dot" class="dot"></span><span id="status">Not connected</span></div>
    <details>
      <summary>test trace</summary>
      <div id="trace"></div>
    </details>
    <audio id="remoteAudio" autoplay playsinline></audio>
  </main>
<script>
(() => {
  const button = document.getElementById('enter');
  const status = document.getElementById('status');
  const dot = document.getElementById('dot');
  const title = document.getElementById('title');
  const sub = document.getElementById('sub');
  const trace = document.getElementById('trace');
  const audio = document.getElementById('remoteAudio');

  let peer = null;
  let events = null;
  let microphone = null;
  let ready = false;
  let closing = false;
  let greetingInstructionId = null;
  let inputTranscript = '';
  let outputTranscript = '';

  const log = (...parts) => {
    const line = parts.map(x => typeof x === 'string' ? x : JSON.stringify(x)).join(' ');
    trace.textContent += `${new Date().toLocaleTimeString()}  ${line}\n`;
    trace.scrollTop = trace.scrollHeight;
    console.log('[Round Rock]', ...parts);
  };

  function setStatus(text, mode = '') {
    status.textContent = text;
    dot.className = `dot ${mode}`.trim();
  }

  async function waitForIce(connection) {
    if (connection.iceGatheringState === 'complete') return;
    await new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        connection.removeEventListener('icegatheringstatechange', onChange);
        reject(new Error('Timed out gathering connection candidates'));
      }, 10000);
      function onChange() {
        if (connection.iceGatheringState !== 'complete') return;
        clearTimeout(timer);
        connection.removeEventListener('icegatheringstatechange', onChange);
        resolve();
      }
      connection.addEventListener('icegatheringstatechange', onChange);
      onChange();
    });
  }

  function send(event) {
    if (!events || events.readyState !== 'open') return false;
    events.send(JSON.stringify(event));
    log('→', event.type, event.event_id || '');
    return true;
  }

  function askJebToOpen() {
    greetingInstructionId = `open_${Date.now()}`;
    send({
      type: 'session.instructions.append',
      event_id: greetingInstructionId,
      delegation_id: null,
      content: 'Speak English. Begin immediately without waiting for the visitor. Open with exactly this intent and wording if natural: “You the fellow asking after the livery job?” Then stop. Give the visitor the floor and listen. Do not add explanation.'
    });
  }

  function handleEvent(event) {
    if (event.type === 'session.started') {
      ready = true;
      button.disabled = false;
      button.textContent = 'Leave Round Rock';
      button.classList.add('live');
      title.textContent = 'Jeb is here';
      sub.textContent = 'Talk to him. Interrupt him. Pause. Silence is allowed.';
      setStatus('Mic live · listening', 'live');
      log('session started', event.session?.id || '');
      askJebToOpen();
      return;
    }

    if (event.type === 'session.instructions.appended' && event.client_event_id === greetingInstructionId) {
      send({
        type: 'session.commentary.append',
        event_id: `begin_${Date.now()}`,
        delegation_id: null,
        content: 'Begin the conversation now, following the opening instruction.'
      });
      return;
    }

    if (event.type === 'session.input_transcript.delta') {
      inputTranscript += event.delta || '';
      setStatus('You are speaking', 'live');
      return;
    }

    if (event.type === 'session.input_transcript.done' || event.type === 'session.input_transcript.completed') {
      if (inputTranscript.trim()) log('YOU:', inputTranscript.trim());
      inputTranscript = '';
      setStatus('Jeb is listening', 'live');
      return;
    }

    if (event.type === 'session.output_transcript.delta') {
      outputTranscript += event.delta || '';
      setStatus('Jeb is speaking', 'live');
      return;
    }

    if (event.type === 'session.output_transcript.done' || event.type === 'session.output_transcript.completed') {
      if (outputTranscript.trim()) log('JEB:', outputTranscript.trim());
      outputTranscript = '';
      setStatus('Mic live · listening', 'live');
      return;
    }

    if (event.type === 'error' || event.type === 'session.error') {
      log('ERROR', event.error || event);
      const message = event.error?.message || 'Live conversation error';
      setStatus(message, 'error');
      return;
    }

    if (event.type === 'session.closed') {
      log('session closed', event.usage || '');
      teardown('Conversation ended');
      return;
    }

    // Useful while this is still a proof; keeps the visible UI quiet.
    if (event.type?.includes('delegat') || event.type?.startsWith('response.')) log(event.type);
  }

  function teardown(message = 'Not connected') {
    try { microphone?.getTracks().forEach(track => track.stop()); } catch {}
    try { events?.close(); } catch {}
    try { peer?.close(); } catch {}
    audio.srcObject = null;
    peer = null;
    events = null;
    microphone = null;
    ready = false;
    closing = false;
    greetingInstructionId = null;
    inputTranscript = '';
    outputTranscript = '';
    button.disabled = false;
    button.textContent = 'Enter Round Rock';
    button.classList.remove('live');
    title.textContent = 'The New Hand';
    sub.textContent = 'One tap. Then talk naturally. Interrupt. Look around. Take your time.';
    setStatus(message);
  }

  async function start() {
    button.disabled = true;
    setStatus('Connecting…');
    log('starting');

    try {
      if (!window.RTCPeerConnection) throw new Error('This browser does not support WebRTC');
      if (!navigator.mediaDevices?.getUserMedia) throw new Error('Microphone access is unavailable in this browser');

      const connection = new RTCPeerConnection();
      peer = connection;

      connection.addEventListener('track', (event) => {
        audio.srcObject = event.streams?.[0] || new MediaStream([event.track]);
        audio.play().catch(err => {
          log('audio autoplay blocked', err.message);
          setStatus('Tap the screen once to hear Jeb', 'live');
        });
      });

      connection.addEventListener('connectionstatechange', () => {
        log('peer', connection.connectionState);
        if (['failed', 'disconnected'].includes(connection.connectionState) && !closing) {
          setStatus('Connection lost', 'error');
        }
      });

      // The button press is the user gesture that grants microphone/audio setup.
      microphone = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
      for (const track of microphone.getAudioTracks()) connection.addTrack(track, microphone);

      events = connection.createDataChannel('oai-events');
      events.addEventListener('message', ({ data }) => {
        try { handleEvent(JSON.parse(data)); }
        catch (err) { log('bad event', err.message); }
      });
      events.addEventListener('close', () => {
        if (!closing && ready) teardown('Connection closed');
      });

      const offer = await connection.createOffer();
      await connection.setLocalDescription(offer);
      await waitForIce(connection);
      const sdp = connection.localDescription?.sdp;
      if (!sdp) throw new Error('Could not create a local audio connection offer');

      const response = await fetch('/api/session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sdp })
      });
      const text = await response.text();
      let result;
      try { result = JSON.parse(text); }
      catch { throw new Error(text || `Session request failed (${response.status})`); }
      if (!response.ok) throw new Error(result.details || result.error || `Session request failed (${response.status})`);
      if (!result?.transport?.sdp) throw new Error('GPT-Live returned no SDP answer');

      log('created session', result.session?.id || '');
      await connection.setRemoteDescription({ type: 'answer', sdp: result.transport.sdp });
      // The HTTP request starts the session. Wait for session.started.
    } catch (error) {
      log('start failed', error.message || String(error));
      teardown(error.message || 'Could not start');
      setStatus(error.message || 'Could not start', 'error');
    }
  }

  function stop() {
    if (!ready || !events || events.readyState !== 'open') {
      teardown();
      return;
    }
    closing = true;
    button.disabled = true;
    setStatus('Leaving Round Rock…');
    send({ type: 'session.close' });
    setTimeout(() => {
      if (closing) teardown('Conversation ended');
    }, 8000);
  }

  button.addEventListener('click', () => ready ? stop() : start());
  document.addEventListener('pointerdown', () => {
    if (audio.srcObject && audio.paused) audio.play().catch(() => {});
  });
})();
</script>
</body>
</html>
