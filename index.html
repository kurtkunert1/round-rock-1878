<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Round Rock 1878 · 1.15</title>
<style>body{font-family:system-ui,sans-serif;background:#f2eee4;color:#211f1a;margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;border-bottom:1px solid #999;padding-bottom:10px}.small{font-size:12px;color:#666}.xray{background:#171714;color:#e9e5d8;padding:14px;border-radius:8px;margin:16px 0;font-family:ui-monospace,monospace;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.cell{border:1px solid #4a4941;padding:8px;border-radius:5px}.log{min-height:280px;background:white;border:1px solid #bbb;padding:14px;border-radius:8px;overflow:auto}.line{margin:8px 0}.you{font-weight:700}.jeb{color:#513e22}.field{color:#666;font-style:italic}.controls{display:flex;gap:8px;margin-top:12px}input{flex:1;padding:12px;font-size:16px}button{padding:10px 14px}.status{margin-top:8px;font-size:12px;color:#666}</style></head><body><div class="wrap">
<div class="top"><b>ROUND ROCK 1878</b><span class="small">FIELD PLAY · 1.15 · AVAILABILITY PIPELINE</span></div>
<div class="xray"><b>ENVIRONMENT X-RAY</b><div class="grid" id="grid"></div><div id="changes" style="margin-top:10px">CHANGED: world initialized</div></div>
<div class="log" id="log"></div><div class="controls"><input id="input" placeholder="Say something or type here"><button id="send">Send</button><button id="mic">🎙</button><button id="wait">Wait</button></div><div class="status" id="status">Checking resolver…</div></div>
<script>
const BUILD='field-play-1.15-availability-pipeline';
const E={minute:0,location:'livery_by_creek',visitor:{purpose:'find Jeb and ask about stable work',knowledge:['A man in Austin referred me to Jeb','I have horse-work experience in San Antonio'],present:true},jeb:{purpose:'meet possible stable hand while tending ordinary work',knowledge:['A possible hand may come looking for me'],present:true,relationship:'stranger / possible applicant'},horse:{name:'bay gelding',location:'livery_by_creek',state:'standing quietly',present:true},ranger:{location:'road_out_of_view',state:'riding on own business',present:true},availability:{},observations:[],exchanges:[]};
let turn=0,busy=false,seen=new Set();
const $=id=>document.getElementById(id); function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function add(who,text,cls){$('log').insertAdjacentHTML('beforeend',`<div class="line ${cls}"><span>${who}:</span> ${esc(text)}</div>`);$('log').scrollTop=$('log').scrollHeight}
function isAvailable(observer,obj){if(!obj.present)return {yes:false,why:'not present'};if(obj===E.ranger)return E.ranger.location==='creek_road_visible'?{yes:true,why:'visible creek road overlaps observer sensory field'}:{yes:false,why:'road segment is out of view'};if(obj===E.horse)return {yes:true,why:'same livery space'};if(obj===E.visitor||obj===E.jeb)return {yes:true,why:'co-present at livery'};return {yes:false,why:'no relation'} }
function observe(observer,name,obj,claim){const a=isAvailable(observer,obj);E.availability[observer+'→'+name]=a;if(!a.yes)return;const sig=`${observer}|${name}|${E.minute}|${obj.location||E.location}|${obj.state||'present'}`;if(seen.has(sig))return;seen.add(sig);const o={minute:E.minute,observer,object:name,evidence:'direct availability',claim};E.observations.push(o);if(observer==='Jeb'){const k=`Observed ${claim}`;if(!E.jeb.knowledge.includes(k))E.jeb.knowledge.push(k)} }
function reconcilePerception(){observe('Jeb','visitor',E.visitor,'the visitor is present at the livery');observe('Jeb','horse',E.horse,`the bay gelding is ${E.horse.state}`);observe('Jeb','ranger',E.ranger,`a mounted Ranger is ${E.ranger.location==='creek_road_visible'?'visible on the creek road':'out of view'}`);observe('visitor','Jeb',E.jeb,'Jeb is present at the livery');observe('visitor','horse',E.horse,`the bay gelding is ${E.horse.state}`);observe('visitor','ranger',E.ranger,`a mounted Ranger is visible on the creek road`)}
function render(change='none'){
 const av=(o,n)=>{const a=E.availability[o+'→'+n]||{yes:false,why:'not evaluated'};return `${a.yes?'YES':'NO'} — ${a.why}`};
 const obs=E.observations.slice(-4).map(o=>`${o.observer}: ${o.claim}`).join('<br>')||'none';
 $('grid').innerHTML=`<div class="cell"><b>WORLD / EXISTENCE</b><br>you: livery<br>Jeb: ${E.jeb.present?'livery':'away'}<br>horse: ${esc(E.horse.state)}<br>Ranger: ${esc(E.ranger.location)}</div><div class="cell"><b>AVAILABLE TO JEB</b><br>you: ${esc(av('Jeb','visitor'))}<br>horse: ${esc(av('Jeb','horse'))}<br>Ranger: ${esc(av('Jeb','ranger'))}</div><div class="cell"><b>OBSERVATION</b><br>${obs}</div><div class="cell"><b>JEB OBJECT STATE</b><br>relationship: ${esc(E.jeb.relationship)}<br>knows: ${esc(E.jeb.knowledge.slice(-5).join(' · '))}</div><div class="cell"><b>TIME</b><br>T+${E.minute} min<br>world runs without speech</div>`;
 $('changes').textContent='CHANGED: '+change;
}
function worldStep(n=1){let changes=[];for(let i=0;i<n;i++){E.minute++;if(E.minute===3){E.horse.state='pawing at the ground';changes.push('horse state changed: pawing')}if(E.minute===6){E.ranger.location='creek_road_visible';changes.push('Ranger location changed: creek road visible')}if(E.minute===9){E.ranger.location='road_out_of_view';changes.push('Ranger location changed: out of view')}reconcilePerception()}render(changes.join('; ')||`time advanced to T+${E.minute}`);if(changes.length)add('FIELD',changes.join('. ')+'.','field')}
function registerExchange(text){const ex={id:'x'+(++turn),minute:E.minute,from:'visitor',to:'Jeb',text,status:'heard because co-present'};E.exchanges.push(ex);const k=`Visitor reported: “${text}”`;E.jeb.knowledge.push(k);if(/work|job|hire/i.test(text))E.jeb.relationship='applicant / evaluating';return ex}
function context(){return {build:BUILD,turn,environment:{minute:E.minute,location:E.location,world_truth:{visitor:E.visitor,jeb:E.jeb,horse:E.horse,ranger:E.ranger},availability:E.availability,observations:E.observations.slice(-12),recent_exchanges:E.exchanges.slice(-8),jeb_object_state:E.jeb},rules:['Resolve through this pipeline: WORLD EXISTENCE → RELATIONAL AVAILABILITY → OBSERVATION → OBJECT STATE → EXPRESSION.','World truth is not automatically Jeb knowledge. Only registered observations and heard exchanges may enter Jeb object state.','Availability is the bridge between existence and observation. If an object is unavailable to Jeb, do not let Jeb perceive it.','If an observation is registered, Jeb may use it without asking the visitor to supply the same information.','A visitor report persists as a report in Jeb knowledge even when unverified.','The Ranger uses the exact same availability/observation pipeline as visitor and horse; no privileged event pathway.','Do not invent Bass, Murphy, hiding, danger, urgency, or historical identity.','Jeb may be ordinary and concise. Personality shapes expression but cannot create state.']}}
async function speak(text){try{const r=await fetch('/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!r.ok)return;const b=await r.blob(),u=URL.createObjectURL(b),a=new Audio(u);a.onended=()=>URL.revokeObjectURL(u);a.play()}catch{}}
async function send(){const text=$('input').value.trim();if(!text||busy)return;$('input').value='';busy=true;add('YOU',text,'you');registerExchange(text);render('visitor→Jeb exchange registered persistently');worldStep(1);$('status').textContent='Resolving from environment…';try{const r=await fetch('/resolver/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({raw_transcript:text,current_context:context()})});const j=await r.json();worldStep(1);if(!r.ok)throw new Error(j.error||r.status);const t=j.resolution?.response_text;if(t){add('JEB',t,'jeb');speak(t)}else add('JEB','[silence]','jeb');$('status').textContent=`Ready · ${j.latency_ms||'?'} ms`}catch(e){add('FIELD','Resolver error: '+e.message,'field');$('status').textContent='Resolver error'}finally{busy=false}}
$('send').onclick=send;$('input').onkeydown=e=>{if(e.key==='Enter')send()};$('wait').onclick=()=>worldStep(2);
if('webkitSpeechRecognition'in window||'SpeechRecognition'in window){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,r=new SR();r.continuous=false;r.interimResults=false;r.onresult=e=>{$('input').value=e.results[0][0].transcript;send()};r.onerror=e=>$('status').textContent='Mic: '+e.error;$('mic').onclick=()=>r.start()}else $('mic').disabled=true;
fetch('/resolver/health').then(r=>r.json()).then(j=>$('status').textContent=`Ready · ${j.model}`).catch(()=>$('status').textContent='Resolver unavailable');
reconcilePerception();add('FIELD','You came from Austin with a name: Jeb. You are looking for stable work.','field');add('JEB','You the fellow looking for work?','jeb');render('world initialized; availability evaluated; initial observations registered');setInterval(()=>worldStep(1),10000);
</script></body></html>
